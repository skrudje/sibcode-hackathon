log_format privacy '$request_method $uri $status request_id=$request_id';
limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  access_log /var/log/nginx/access.log privacy;
  client_max_body_size 11m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  location = /api/v1/auth/login {
    client_max_body_size 16k;
    limit_req zone=login burst=20 nodelay;
    limit_req_status 429;
    error_page 429 = @login_limited;
    proxy_pass http://api:8010;
    proxy_set_header Host $http_host;
  }
  location @login_limited {
    default_type application/json;
    add_header Retry-After 60 always;
    return 429 '{"error":{"code":"rate_limited","message":"Слишком много попыток. Повторите позже.","details":[],"request_id":"$request_id"}}';
  }
  location /api/ {
    proxy_pass http://api:8010;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
  location / { try_files $uri /index.html; }
}
