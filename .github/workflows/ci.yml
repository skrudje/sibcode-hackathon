name: Product checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  repository:
    name: Repository hygiene and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python infra/check_repository.py
      - name: Scan Git history for secrets
        run: |
          docker run --rm --network none -v "$PWD:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --log-opts=--all --redact=100 --no-banner
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run generate:api
      - run: git diff --exit-code -- src/api.generated.ts
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hryukers
          POSTGRES_PASSWORD: hryukers-local-db
          POSTGRES_DB: hryukers_test
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U hryukers -d hryukers_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r apps/api/requirements.lock
      - name: Backend tests
        env:
          PYTHONPATH: apps/api
          TEST_DATABASE_URL: postgresql+psycopg://hryukers:hryukers-local-db@localhost:55432/hryukers_test
        run: python -m pytest -q apps/api/tests
