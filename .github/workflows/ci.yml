name: Product checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run generate:api
      - run: git diff --exit-code -- src/api.generated.ts
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hryukers
          POSTGRES_PASSWORD: hryukers-local-db
          POSTGRES_DB: hryukers_test
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U hryukers -d hryukers_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r apps/api/requirements.lock
      - name: Backend tests
        env:
          PYTHONPATH: apps/api
          TEST_DATABASE_URL: postgresql+psycopg://hryukers:hryukers-local-db@localhost:55432/hryukers_test
        run: python -m pytest -q apps/api/tests
