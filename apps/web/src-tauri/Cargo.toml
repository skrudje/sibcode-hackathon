[package]
name = "hryukers-desktop"
version = "0.1.0"
description = "Hryukers CDP desktop client"
authors = ["Hryukers team"]
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json", "stream"] }
base64 = "0.22"
url = "2"
uuid = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "0.18"

[patch.crates-io]
# GTK3 needs the 0.18 ABI; this includes the upstream VariantStrIter safety fix.
glib = { path = "vendor/glib" }

[profile.test.package.glib]
opt-level = 3
