[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hryukers-cdp"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.9,<3", "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0.36,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "pwdlib[argon2]>=0.2,<1", "python-multipart>=0.0.20,<1",
  "polars>=1.20,<2", "openpyxl>=3.1,<4", "httpx>=0.28,<1",
  "rq>=2.2,<3", "redis>=5,<7"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "openapi-spec-validator>=0.7,<1", "jsonschema>=4,<5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
